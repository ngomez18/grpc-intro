version: v2
clean: true
inputs:
  - directory: proto
plugins:
  # Go plugins
  - remote: buf.build/protocolbuffers/go
    out: generated/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: generated/go
    opt:
      - paths=source_relative
  # Python plugins
  - remote: buf.build/protocolbuffers/python
    out: generated/python
  - remote: buf.build/protocolbuffers/pyi
    out: generated/python